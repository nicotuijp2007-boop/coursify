<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SQL &amp; Databases · Harbourline</title>
<!--
  Course app built on the course kit architecture:
  1. CONTENT is data: data/course.json (lessons, exercises, kit blocks), built and verified from markdown.
  2. DESIGN is tokens: the :root block below is the only place with colours, fonts, sizes and motion.
     Replace the values with the tokens of your own design file.
  3. RENDERER: one function per block type (K.*) plus one per page (home, module, lesson, checkpoint).
  Rules: no dark mode, keyboard-only works everywhere, prefers-reduced-motion switches all motion off,
  without JavaScript a notice is shown.
-->
<style>
/* ===== DESIGN TOKENS — replace values with your design file's tokens ===== */
:root{
  --c-bg:#f5f6f8; --c-surface:#ffffff; --c-surface-2:#eef1f4;
  --c-border:#d8dde3; --c-border-strong:#b6bec8;
  --c-text:#1c232b; --c-text-2:#56616d;
  --c-primary:#1f4e79; --c-primary-hover:#173c5e; --c-on-primary:#ffffff; --c-primary-soft:#e7eef6;
  --c-ok:#1f7a4d; --c-ok-soft:#e5f3eb;
  --c-warn:#9a5b0c; --c-warn-soft:#fcf0dd;
  --c-err:#b3372f; --c-err-soft:#fbe7e5;
  --c-info:#3d5f80; --c-info-soft:#e7eef5;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px; --text-xl:22px; --text-2xl:30px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px;
  --radius-sm:6px; --radius:10px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(28,35,43,.06),0 2px 8px rgba(28,35,43,.05);
  --shadow-lg:0 8px 32px rgba(28,35,43,.18);
  --focus:0 0 0 2px var(--c-surface),0 0 0 4px var(--c-primary);
  --dur-fast:200ms; --dur:360ms; --dur-word:420ms; --dur-slow:700ms;
  --ease:cubic-bezier(.2,0,0,1);
  --side-w:280px;
}

/* ===== BASE ===== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--c-bg);color:var(--c-text);font:400 var(--text-base)/1.6 var(--font-body);overflow-x:clip}
h1,h2,h3,h4{line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:var(--text-2xl);font-weight:800}
h2{font-size:var(--text-xl);font-weight:700}
h3{font-size:var(--text-lg);font-weight:700}
p{margin:0 0 var(--space-3)}
a{color:var(--c-primary)}
code,pre,kbd{font-family:var(--font-mono);font-size:.9em}
:not(pre)>code{background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:4px;padding:0 4px}
pre{position:relative;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);overflow-x:auto;margin:0 0 var(--space-3);white-space:pre}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--c-text-2)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== LAYOUT ===== */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{background:var(--c-surface);border-right:1px solid var(--c-border);padding:var(--space-5) var(--space-4);position:sticky;top:0;height:100vh;overflow-y:auto}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);background:var(--c-bg);border-bottom:1px solid var(--c-border)}
.topbar .grow{flex:1}
.page{padding:var(--space-6) var(--space-5) var(--space-7)}
.col{max-width:80ch;margin:0 auto}
.scrim{display:none}
#menuBtn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,var(--side-w));z-index:20;transform:translateX(-100%);transition:transform var(--dur) var(--ease)}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(28,35,43,.35);z-index:15}
  #menuBtn{display:inline-flex}
  .page{padding:var(--space-5) var(--space-4) var(--space-7)}
  .topbar{padding:var(--space-2) var(--space-4)}
  .topbar .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}

/* sidebar */
.side .eyebrow{font-size:var(--text-sm);color:var(--c-text-2);margin-bottom:var(--space-1)}
.side .brand{display:block;text-decoration:none;color:var(--c-text)}
.side h2{font-size:var(--text-lg);margin-bottom:var(--space-2)}
.progress{height:8px;background:var(--c-surface-2);border-radius:99px;overflow:hidden;margin:var(--space-2) 0 var(--space-1)}
.progress span{display:block;height:100%;background:var(--c-primary);width:0;transition:width var(--dur-slow) var(--ease)}
.progress-label{font-size:var(--text-sm);color:var(--c-text-2);margin-bottom:var(--space-4)}
.group{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-2);margin:var(--space-4) 0 var(--space-2)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a,.toc .mod{display:flex;gap:var(--space-2);align-items:flex-start;width:100%;padding:var(--space-2);border:0;background:none;border-radius:var(--radius-sm);color:var(--c-text);text-decoration:none;font-size:var(--text-sm);text-align:left}
.toc a:hover,.toc .mod:hover{background:var(--c-surface-2)}
.toc a[aria-current="page"]{background:var(--c-primary-soft);color:var(--c-primary);font-weight:600}
.toc .mod{font-weight:600}
.toc .mod .pct{margin-left:auto;font-weight:400;color:var(--c-text-2);font-variant-numeric:tabular-nums}
.toc .sub{list-style:none;margin:0 0 var(--space-2);padding:0 0 0 var(--space-5);display:grid;gap:2px}
.toc .sub[hidden]{display:none}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--c-border-strong);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c-text-2);margin-top:1px}
.seen>a .tick,.tick.on{background:var(--c-ok);border-color:var(--c-ok);color:var(--c-on-primary)}
.modnum{flex:none;min-width:28px;height:20px;border-radius:var(--radius-sm);background:var(--c-surface-2);display:grid;place-items:center;font-size:var(--text-xs);font-weight:800;margin-top:1px}
.mod.done .modnum{background:var(--c-ok);color:var(--c-on-primary)}

/* top bar pieces */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--c-border-strong);background:var(--c-surface);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);font-weight:600;text-decoration:none;color:var(--c-text);transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.btn:hover{background:var(--c-surface-2)}
.btn.primary{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-on-primary)}
.btn.primary:hover{background:var(--c-primary-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--c-surface-2)}
.btn.sm{padding:var(--space-1) var(--space-3);font-size:var(--text-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4);align-items:center}
.engine{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--c-text-2);border:1px solid var(--c-border);background:var(--c-surface);border-radius:99px;padding:2px var(--space-3)}
.engine .dot{width:8px;height:8px;border-radius:50%;background:var(--c-warn)}
.engine.ok .dot{background:var(--c-ok)} .engine.bad .dot{background:var(--c-err)}

/* hero & chapter heads */
.hero{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:var(--space-6);margin-bottom:var(--space-6);box-shadow:var(--shadow)}
.hero .eyebrow,.eyebrow-link{color:var(--c-primary);font-weight:700;font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;text-decoration:none}
.hero h1{margin:var(--space-2) 0}
.hero .promise{color:var(--c-text-2);font-size:var(--text-lg);margin-bottom:var(--space-4)}
.hero ul{margin:var(--space-2) 0 0;padding-left:1.2em}
.meta{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4)}
.pill{font-size:var(--text-sm);background:var(--c-primary-soft);color:var(--c-primary);border-radius:99px;padding:2px var(--space-3);font-weight:600}
.pill.ok{background:var(--c-ok-soft);color:var(--c-ok)} .pill.warn{background:var(--c-warn-soft);color:var(--c-warn)}
.chapter{margin-top:var(--space-7);scroll-margin-top:80px}
.chapter:first-child{margin-top:0}
.chapter-head{display:flex;gap:var(--space-4);align-items:flex-start;margin-bottom:var(--space-5)}
.chapter-num{flex:none;width:44px;height:44px;border-radius:var(--radius);background:var(--c-primary);color:var(--c-on-primary);display:grid;place-items:center;font-weight:800;font-size:var(--text-lg)}
.chapter-num.sm{width:36px;height:36px;font-size:var(--text-base)}
.chapter-num.done{background:var(--c-ok)}
.chapter-head .lead{color:var(--c-text-2);margin:var(--space-1) 0 0}
.section-title{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-7) 0 var(--space-4)}
.section-title h2{font-size:var(--text-xl)}
.block{margin-bottom:var(--space-5)}
.chapters{display:grid;gap:var(--space-3)}
.chapter-link{display:flex;gap:var(--space-4);align-items:flex-start;text-decoration:none;color:var(--c-text);background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);transition:border-color var(--dur-fast) var(--ease)}
.chapter-link:hover{border-color:var(--c-primary)}
.chapter-link .t{font-weight:700}
.chapter-link .d{font-size:var(--text-sm);color:var(--c-text-2)}
.chapter-link .r{margin-left:auto;text-align:right;font-size:var(--text-sm);color:var(--c-text-2);white-space:nowrap}

/* prose */
.prose>*:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 var(--space-3);padding-left:1.3em}
.prose li{margin-bottom:var(--space-1)}
.prose h3,.prose h4{margin:var(--space-5) 0 var(--space-2)}
.prose table{margin-bottom:var(--space-4)}
.prose .tbl-wrap{margin-bottom:var(--space-4)}
.prose blockquote{margin:0 0 var(--space-3);padding:var(--space-3) var(--space-4);border-left:4px solid var(--c-info);background:var(--c-info-soft);border-radius:var(--radius-sm)}
.prose dl{margin:0 0 var(--space-3)} .prose dt{font-weight:700} .prose dd{margin:0 0 var(--space-2)}

/* cards */
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-5);box-shadow:var(--shadow);margin-bottom:var(--space-5)}
.card.done{border-color:var(--c-ok)}
.card-title{font-weight:700;margin-bottom:var(--space-3);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.card-title .grow{flex:1}
.tag{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c-primary);background:var(--c-primary-soft);border-radius:99px;padding:1px var(--space-2)}
.tag.ok{color:var(--c-ok);background:var(--c-ok-soft)} .tag.warn{color:var(--c-warn);background:var(--c-warn-soft)} .tag.err{color:var(--c-err);background:var(--c-err-soft)}

/* editor and results */
textarea.sql{display:block;width:100%;min-height:96px;resize:vertical;font:var(--text-sm)/1.55 var(--font-mono);color:var(--c-text);background:var(--c-surface-2);border:1px solid var(--c-border-strong);border-radius:var(--radius-sm);padding:var(--space-3);tab-size:2;margin:var(--space-3) 0 0}
textarea.sql:focus-visible{background:var(--c-surface)}
textarea.plain{font-family:var(--font-body)}
.res{margin-top:var(--space-3)}
.res:empty{display:none}
.res-label{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-2);margin:var(--space-3) 0 var(--space-2)}
.res-label:first-child{margin-top:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--c-border);border-radius:var(--radius);background:var(--c-surface)}
table{border-collapse:collapse;width:100%;font-size:var(--text-sm)}
th,td{text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--c-border);vertical-align:top}
th{background:var(--c-surface-2);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.null{color:var(--c-text-2);font-style:italic}
.res .tbl-wrap td,.res .tbl-wrap th{font-family:var(--font-mono);font-size:13px;white-space:nowrap}
caption,.tbl-foot{caption-side:bottom;text-align:left;padding:var(--space-2) var(--space-3);font-size:var(--text-sm);color:var(--c-text-2)}
.tbl-foot{padding:var(--space-1) 0 0;margin:0}
pre.logs{margin:0;white-space:pre-wrap}
.copyb{position:absolute;top:var(--space-1);right:var(--space-1);background:var(--c-surface)}
pre.has-copy{padding-top:40px}
.empty{color:var(--c-text-2);font-size:var(--text-sm)}

/* feedback (one style for every message) */
.fb{margin-top:var(--space-3);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);border-left:4px solid;white-space:pre-wrap}
.fb:empty{display:none}
.fb:first-child{margin-top:0}
.fb.ok{background:var(--c-ok-soft);border-color:var(--c-ok)}
.fb.err{background:var(--c-err-soft);border-color:var(--c-err)}
.fb.warn{background:var(--c-warn-soft);border-color:var(--c-warn)}
.fb.info{background:var(--c-info-soft);border-color:var(--c-info)}
.fb strong:first-child{display:block}
.fb ul{white-space:normal}

/* callout & summary */
.callout{border-radius:var(--radius);padding:var(--space-4) var(--space-5);border-left:4px solid;margin-bottom:var(--space-5)}
.callout.info{background:var(--c-info-soft);border-color:var(--c-info)}
.callout.tip{background:var(--c-ok-soft);border-color:var(--c-ok)}
.callout.warning{background:var(--c-warn-soft);border-color:var(--c-warn)}
.callout-title{font-weight:700;margin-bottom:var(--space-1)}
.callout p:last-child{margin:0}
.summary{background:var(--c-primary-soft);border:1px solid var(--c-primary);border-radius:var(--radius);padding:var(--space-5)}
.summary ul{margin:0;padding-left:1.2em}
.summary li{margin-bottom:var(--space-2)}
.summary .docs{margin:var(--space-3) 0 0;font-size:var(--text-sm)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);margin-bottom:var(--space-5)}
.stat{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4)}
.stat .v{font-size:var(--text-2xl);font-weight:800;color:var(--c-primary);line-height:1.1}
.stat .v small{font-size:var(--text-base);font-weight:600;color:var(--c-text-2)}
.stat .l{font-size:var(--text-sm);color:var(--c-text-2);margin-top:var(--space-1)}
.bar{height:6px;background:var(--c-surface-2);border-radius:99px;margin-top:var(--space-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--c-primary);width:var(--w)}

/* then-now */
.then-now{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-3);align-items:stretch}
.then-now .card{margin:0}
.then-now .arrow{align-self:center;font-size:var(--text-xl);color:var(--c-text-2)}
.then-now .then{background:var(--c-surface-2)}
.then-now .now{border-color:var(--c-primary)}
.then-now ul{margin:0;padding-left:1.1em}
@media (max-width:640px){.then-now{grid-template-columns:1fr}.then-now .arrow{transform:rotate(90deg);justify-self:center}}

/* flow & timeline */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);counter-reset:step}
.flow li{position:relative;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);counter-increment:step}
.flow li::before{content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c-primary);color:var(--c-on-primary);font-weight:800;font-size:var(--text-sm);margin-bottom:var(--space-2)}
.flow .t{font-weight:700}
.flow .d{font-size:var(--text-sm);color:var(--c-text-2)}
.timeline{list-style:none;margin:0;padding:0 0 0 var(--space-5);border-left:2px solid var(--c-border)}
.timeline li{position:relative;margin-bottom:var(--space-4)}
.timeline li::before{content:"";position:absolute;left:calc(-1 * var(--space-5) - 7px);top:6px;width:12px;height:12px;border-radius:50%;background:var(--c-primary);border:2px solid var(--c-surface)}
.timeline .when{font-size:var(--text-sm);font-weight:700;color:var(--c-primary)}
.timeline .t{font-weight:700}

/* options (mc, predict, dilemma) */
.options{display:grid;gap:var(--space-2)}
.option{text-align:left;border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);transition:border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.option:hover:not([disabled]){border-color:var(--c-primary);background:var(--c-primary-soft)}
.option[disabled]{cursor:default}
.option.is-ok{border-color:var(--c-ok);background:var(--c-ok-soft)}
.option.is-err{border-color:var(--c-err);background:var(--c-err-soft)}
.option .label{font-weight:700;margin-right:var(--space-2)}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-3)}
.flip{perspective:900px;border:0;padding:0;background:none;text-align:left;min-height:140px}
.flip-inner{display:grid;height:100%;transition:transform var(--dur) var(--ease);transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-inner{transform:rotateY(180deg)}
.flip-face{grid-area:1/1;backface-visibility:hidden;border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface);display:flex;flex-direction:column;justify-content:center}
.flip-face.front{font-weight:700;font-size:var(--text-lg)}
.flip-face.front small{font-weight:400;font-size:var(--text-sm);color:var(--c-text-2);margin-top:var(--space-2)}
.flip-face.back{transform:rotateY(180deg);background:var(--c-primary-soft);border-color:var(--c-primary);font-size:var(--text-sm)}

/* sort */
.sort-pool{display:flex;flex-wrap:wrap;gap:var(--space-2);min-height:44px;padding:var(--space-2);border:1px dashed var(--c-border-strong);border-radius:var(--radius-sm);margin-bottom:var(--space-3)}
.chip{border:1px solid var(--c-border-strong);background:var(--c-surface);border-radius:var(--radius);padding:var(--space-1) var(--space-3);font-size:var(--text-sm);text-align:left}
.chip[aria-pressed="true"]{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-on-primary)}
.chip.is-ok{background:var(--c-ok-soft);border-color:var(--c-ok)}
.chip.is-err{background:var(--c-err-soft);border-color:var(--c-err)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-3)}
.bucket{border:1px solid var(--c-border);border-radius:var(--radius);background:var(--c-surface-2);padding:var(--space-3)}
.bucket .bucket-btn{width:100%;margin-bottom:var(--space-2);justify-content:center;font-size:var(--text-sm);overflow-wrap:anywhere;text-align:center}
.bucket .placed{display:flex;flex-wrap:wrap;gap:var(--space-2)}

/* spot errors */
.lines{border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-surface-2);padding:var(--space-2);display:grid;gap:2px}
.line{text-align:left;font-family:var(--font-mono);font-size:var(--text-sm);border:1px solid transparent;background:transparent;border-radius:4px;padding:var(--space-1) var(--space-2);white-space:pre-wrap}
.line:hover:not([disabled]){background:var(--c-surface)}
.line[aria-pressed="true"]{border-color:var(--c-warn);background:var(--c-warn-soft)}
.line.is-ok{border-color:var(--c-ok);background:var(--c-ok-soft)}
.line.is-err{border-color:var(--c-err);background:var(--c-err-soft)}
.line.is-missed{border-color:var(--c-err);border-style:dashed}

/* dilemma */
.scenario{background:var(--c-surface-2);border-radius:var(--radius-sm);padding:var(--space-4);margin-bottom:var(--space-4)}
.scenario .who{font-size:var(--text-sm);font-weight:700;color:var(--c-primary);margin-bottom:var(--space-1)}

/* role tabs */
[role=tablist]{display:flex;flex-wrap:wrap;gap:var(--space-1);border-bottom:1px solid var(--c-border);margin-bottom:var(--space-4)}
[role=tab]{border:0;background:none;padding:var(--space-2) var(--space-3);border-bottom:3px solid transparent;font-weight:600;color:var(--c-text-2)}
[role=tab][aria-selected="true"]{color:var(--c-primary);border-color:var(--c-primary)}
[role=tabpanel] ul{margin:var(--space-2) 0 0;padding-left:1.2em}

/* builder */
.build-line{min-height:52px;display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-3);border:2px dashed var(--c-border-strong);border-radius:var(--radius-sm);background:var(--c-surface-2);font-family:var(--font-mono);font-size:var(--text-sm)}
.build-line .placeholder{color:var(--c-text-2);font-family:var(--font-body)}
.build-line.is-ok{border-style:solid;border-color:var(--c-ok);background:var(--c-ok-soft)}
.piece{font-family:var(--font-mono);font-size:var(--text-sm)}
.pieces{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}

/* project checkpoint */
details{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);margin-top:var(--space-3);background:var(--c-surface)}
summary{cursor:pointer;font-weight:600}
.checklist{list-style:none;padding:0;margin:var(--space-3) 0 0;display:grid;gap:var(--space-2)}
.checklist label{display:flex;gap:var(--space-2);align-items:flex-start;cursor:pointer}
.checklist input{margin-top:5px;accent-color:var(--c-ok)}

/* stepper */
.stage{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--space-3);margin:var(--space-3) 0}
@media (max-width:640px){.stage{grid-template-columns:1fr}}
.stage-col{background:var(--c-surface-2);border-radius:var(--radius-sm);padding:var(--space-3);min-width:0}
.stage-col h4{margin:0 0 var(--space-2);font-size:var(--text-sm);color:var(--c-text-2);text-transform:uppercase;letter-spacing:.05em}
.stage-item{font-family:var(--font-mono);font-size:13px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:4px;padding:var(--space-1) var(--space-2);margin-bottom:var(--space-1);overflow-wrap:anywhere;transition:border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.stage-item[hidden]{display:none}
.stage-item.hl{border-color:var(--c-primary);background:var(--c-primary-soft);font-weight:700}
.caption{min-height:3.2em;font-weight:500}
.step-count{font-size:var(--text-sm);color:var(--c-text-2)}

/* quiz */
.quiz fieldset{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);margin:0 0 var(--space-3);background:var(--c-surface)}
.quiz legend{float:left;width:100%;font-weight:700;padding:0;margin-bottom:var(--space-2)}
.quiz legend+*{clear:both}
.quiz label{display:flex;gap:var(--space-2);padding:var(--space-1) 0;cursor:pointer}
.quiz input{accent-color:var(--c-primary);margin-top:6px}
.score{font-size:var(--text-xl);font-weight:800}
.timer{display:inline-flex;align-items:center;gap:var(--space-1);font-variant-numeric:tabular-nums;font-weight:700}

/* pager, toasts, modal */
.pager{display:flex;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-7);padding-top:var(--space-5);border-top:1px solid var(--c-border);flex-wrap:wrap}
#toasts{position:fixed;right:var(--space-4);bottom:var(--space-4);display:grid;gap:var(--space-2);z-index:40;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--c-surface);border:1px solid var(--c-border);border-left:4px solid var(--c-info);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-lg);font-size:var(--text-sm)}
.toast.ok{border-left-color:var(--c-ok)} .toast.err{border-left-color:var(--c-err);cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(28,35,43,.35);display:grid;place-items:center;z-index:50;padding:var(--space-4)}
.modal{background:var(--c-surface);border-radius:var(--radius-lg);padding:var(--space-6);max-width:460px;box-shadow:var(--shadow-lg)}
.modal h2{margin-bottom:var(--space-3)}
.banner{border-left:4px solid var(--c-warn);background:var(--c-warn-soft);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5)}

/* ===== MOTION (purposeful only) ===== */
[data-reveal="armed"]{opacity:0;transform:translateY(var(--space-2))}
[data-reveal="shown"]{opacity:1;transform:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
@keyframes grow{from{width:0}}
[data-reveal="shown"] .bar span,.bar.grow span{animation:grow var(--dur-slow) var(--ease) both}
@keyframes word-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.word{display:inline-block;animation:word-in var(--dur-word) var(--ease) both}
.appear{animation:word-in var(--dur) var(--ease) both}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:none}}
.pop{animation:pop 320ms var(--ease)}
[data-reveal="shown"] .stagger>*{animation:word-in var(--dur) var(--ease) both}
[data-reveal="shown"] .stagger>*:nth-child(2){animation-delay:90ms}
[data-reveal="shown"] .stagger>*:nth-child(3){animation-delay:180ms}
[data-reveal="shown"] .stagger>*:nth-child(4){animation-delay:270ms}
[data-reveal="shown"] .stagger>*:nth-child(5){animation-delay:360ms}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  [data-reveal]{opacity:1!important;transform:none!important}
}

function setEngine(text, cls) { engineEl.className = 'engine ' + (cls || ''); engineEl.lastChild.textContent = text; }
let FSB = null, WASM = null, INITDB = null;

    const bin = atob(t); const u = new Uint8Array(bin.length);

  db = new PG(Object.assign({ parsers }, snap ? { loadDataDir: snap } : {}, opts));
  await db.exec("SET TimeZone = 'UTC'");
}
async function buildState(mod, lessonIdx) {
  const key = mod.id + ':' + lessonIdx;
  if (key === stateKey && db) return;
  setEngine('Loading data');
  if (SNAP[mod.setup]) await newDb(SNAP[mod.setup]);
  else {
    await newDb();
    for (const step of mod.setup.split('+').map(s => s.trim()).filter(Boolean)) await db.exec(step === 'dataset' ? DATASET : COURSE.setups[step]);

function persistent(ex) { return !ex.temp && !ex.expectError && !ex.manual && ex.sql; }

    if (applied.has(id) || !persistent(ex)) continue;
    try { await db.exec(ex.sql); } catch (e) { if (!silent) console.warn(e); }

function norm(v) {

  if (v instanceof Date) return v.toISOString();
  if (typeof v === 'object') return JSON.stringify(v);

}
function toTable(res) {

  const cols = res.fields.map(f => f.name);
  return { cols, rows: res.rows.map(r => cols.map(c => norm(r[c]))), affected: res.affectedRows };
}

const SEQ_SNAP = "SELECT format('%I.%I', schemaname, sequencename) AS seq, coalesce(last_value, start_value) AS v, last_value IS NOT NULL AS called FROM pg_sequences";

async function run(sql, { temp = true, verify = '' } = {}) {

  const ends = /^\s*(commit|end|rollback(?!\s+to\b))\b/im.test(sql);

function wireJsExercise(card, mod, idx, e, onPass, setSt) {
  const ta = $('textarea', card), out = $('.res', card), solBtn = $('[data-act=sol]', card);
  const prep = async () => { await buildState(mod, idx); await applyExamples(mod.lessons[idx]); };
  $('[data-act=run]', card).addEventListener('click', async () => {
    try { await prep(); out.innerHTML = label('Your output') + logsHtml(await runCode(ta.value)); } catch (err) { out.innerHTML = errHtml(err.message); }
  });
  $('[data-act=check]', card).addEventListener('click', async () => {
    P.drafts[e.id + ':tried'] = true; save(); solBtn.disabled = false; if (!P.ex[e.id]) setSt('tried');
    if (!ta.value.trim()) { out.innerHTML = msgHtml('err', 'Write some code first.'); return; }
    try {
      await prep();
      const mine = await runCode(ta.value);
      if (mine.blocked) { out.innerHTML = logsHtml(mine); return; }
      const ref = await runCode(e.jsSolution);
      const a = mine.logs.join('\n'), b = ref.logs.join('\n');
      if (!mine.error && a === b) { passed(card, e, setSt, onPass); out.innerHTML = msgHtml('ok', 'Your output matches the model answer.', 'Correct') + logsHtml(mine); popRes(out); }
      else {
        const al = mine.logs, bl = ref.logs; let k = 0; while (k < al.length && k < bl.length && al[k] === bl[k]) k++;
        const why = mine.error ? 'Your code stopped with an error.' : al.length !== bl.length && k === Math.min(al.length, bl.length) ? `Your code printed ${al.length} line(s); the model answer prints ${bl.length}.` : `Line ${k + 1} differs. Expected: ${bl[k] ?? '(nothing)'}`;
        out.innerHTML = msgHtml('err', why, 'Not yet') + label('Your output') + logsHtml(mine);
      }
    } catch (err) { out.innerHTML = errHtml(err.message); }
  });
  solBtn.addEventListener('click', () => toggleSolution(card, e.jsSolution, label('Its output') + logsHtml({ logs: e.expectedLogs })));
}
function popRes(out) { const f = out.querySelector('.fb.ok'); if (f && !RM.matches) f.classList.add('pop'); }
function passed(card, e, setSt, onPass) { P.ex[e.id] = true; save(); card.classList.add('done'); setSt('done'); updateProgress(); if (onPass) onPass(); }
function toggleSolution(card, code, extra) {
  const box = $('.solbox', card), btn = $('[data-act=sol]', card);
  if (box.innerHTML) { box.innerHTML = ''; btn.textContent = 'Show model answer'; btn.setAttribute('aria-expanded', 'false'); return; }
  box.innerHTML = `<div class="res appear">${label('Model answer (other correct answers exist)')}<pre><code>${esc(code)}</code></pre>${extra || ''}</div>`;
  btn.textContent = 'Hide model answer'; btn.setAttribute('aria-expanded', 'true');
  addCopyButtons(box);
}
function exerciseCard(e, i) {
  const isJs = e.check === 'js';
  const val = P.drafts[e.id] ?? (isJs ? e.jsStarter : e.starter) ?? '';
  const st = P.ex[e.id] ? 'done' : P.drafts[e.id + ':tried'] ? 'tried' : '';
  const kind = e.check === 'manual' ? 'You check this one' : isJs ? 'JavaScript' : 'SQL';
  return `<div class="card${P.ex[e.id] ? ' done' : ''}" data-exid="${e.id}" data-reveal-target><div class="card-title"><span class="tag">Exercise ${i + 1}</span><span class="tag">${kind}</span><span class="grow"></span><span class="st">${e.check === 'manual' ? '' : statusBadge(st)}</span></div><div class="prose">${e.prompt}</div>${editor('ed-' + e.id, val, isJs ? ' js' : '')}<div class="btns"><button class="btn primary" type="button" data-act="check">${I.check}${e.check === 'manual' ? 'Compare with the model answer' : 'Check answer'}</button><button class="btn" type="button" data-act="run">${I.play}${isJs ? 'Run code' : 'Run query'}</button>${e.hint ? '<button class="btn ghost" type="button" data-act="hint">Hint</button>' : ''}<button class="btn ghost" type="button" data-act="sol" aria-expanded="false" ${P.ex[e.id] || P.drafts[e.id + ':tried'] ? '' : 'disabled'}>Show model answer</button></div><div class="res" aria-live="polite"></div><div class="solbox"></div></div>`;
}
function wireExercise(card, mod, idx, e, onPass) {
  const ta = $('textarea', card), out = $('.res', card), solBtn = $('[data-act=sol]', card);
  const setSt = s => { const st = $('.st', card); if (st && e.check !== 'manual') st.innerHTML = statusBadge(s); };
  ta.addEventListener('input', () => { P.drafts[e.id] = ta.value; save(); });
  if (e.check === 'js') return wireJsExercise(card, mod, idx, e, onPass, setSt);
  $('[data-act=run]', card).addEventListener('click', async () => {
    try { await buildState(mod, idx); await applyExamples(mod.lessons[idx]); const { t, v } = await run(ta.value, { verify: e.verify }); out.innerHTML = label('Your output') + tableHtml(t) + (e.verify ? label('After your change, the check query shows') + tableHtml(v) : ''); }
    catch (err) { out.innerHTML = label('What PostgreSQL says') + errHtml(err.message); }
  });
  $('[data-act=check]', card).addEventListener('click', async () => {
    P.drafts[e.id + ':tried'] = true; save(); solBtn.disabled = false; if (!P.ex[e.id]) setSt('tried');
    if (e.check === 'manual') { out.innerHTML = msgHtml('info', 'There is no automatic check for this one. Open the model answer and compare it with yours, point by point.', 'Check it yourself'); if (!$('.solbox', card).innerHTML) solBtn.click(); return; }
    if (!ta.value.trim()) { out.innerHTML = msgHtml('err', 'Write a query first.'); return; }
    try {
      await buildState(mod, idx); await applyExamples(mod.lessons[idx]);
      const mine = await run(ta.value, { verify: e.verify });
      const ref = await run(e.solution, { verify: e.verify });
      const got = e.verify ? mine.v : mine.t;
      const problem = compare(got, e.verify ? ref.v : ref.t, e.check);
      if (!problem) { passed(card, e, setSt, onPass); out.innerHTML = msgHtml('ok', 'Your result matches the model answer.', 'Correct') + tableHtml(got, 10); popRes(out); }
      else out.innerHTML = msgHtml('err', problem, 'Not yet') + label('Your output') + tableHtml(got, 10);
    } catch (err) { out.innerHTML = label('What PostgreSQL says') + errHtml(err.message); }
  });
  $('[data-act=hint]', card)?.addEventListener('click', () => { out.innerHTML = msgHtml('info', e.hint, 'Hint'); });
  solBtn.addEventListener('click', () => toggleSolution(card, e.solution || e.jsSolution, e.expected ? label('Its result') + tableHtml(e.expected, 10) : ''));
}

    <div class="btns"><button class="btn primary" type="submit">Submit answers</button></div></form><div class="card" id="quizresult" hidden role="status" aria-live="polite"></div></section>` : ''}
  ${others.length ? `<section class="chapter" aria-labelledby="pw-h"><div class="section-title"><span class="chapter-num sm">${mcs.length ? 2 : 1}</span><h2 id="pw-h">Predict and write</h2></div>${others.map((q, i) => quizItem(q, i)).join('')}</section>` : ''}
  ${pr ? `<section class="chapter" aria-labelledby="pr-h"><div class="section-title"><span class="chapter-num sm">${1 + (mcs.length ? 1 : 0) + (others.length ? 1 : 0)}</span><h2 id="pr-h">Practical task</h2></div><div class="card${P.practical[pr.id] ? ' done' : ''}" id="prac" data-exid="${pr.id}"><div class="card-title"><span class="tag">Practical</span><span class="grow"></span><span class="timer" id="timer">${I.clock}${pr.minutes}:00</span><button class="btn sm" type="button" id="tstart">Start timer</button><span class="st">${statusBadge(P.practical[pr.id] ? 'done' : P.drafts[pr.id + ':tried'] ? 'tried' : '')}</span></div><div class="prose">${pr.prompt}</div>${editor('pr-ed', P.drafts[pr.id] ?? (pr.check === 'js' ? pr.jsStarter : '') ?? '', pr.check === 'js' ? ' js' : '')}<div class="btns"><button class="btn primary" type="button" data-act="check">${I.check}Check answer</button><button class="btn" type="button" data-act="run">${I.play}${pr.check === 'js' ? 'Run code' : 'Run query'}</button><button class="btn ghost" type="button" data-act="sol" aria-expanded="false" ${P.drafts[pr.id + ':tried'] ? '' : 'disabled'}>Show model answer</button></div><div class="res" aria-live="polite"></div><div class="solbox"></div><p class="muted" style="margin:var(--space-3) 0 0">You pass when the check is green and you can explain your approach in three sentences in your notes.</p></div></section>` : ''}
  <div class="pager"><a class="btn ghost" href="#${mod.lessons[last]?.id || mod.id}">${I.left}Last lesson</a>${nextModuleLink(mod)}</div>`;
  finishPage();
  if (mcs.length) wireMcQuiz(mod, mcs);
  page.querySelectorAll('[data-q].card').forEach(el => wireQuiz(el, mod, cp.quiz.find(q => q.id === el.dataset.q)));
  if (pr) {
    wireExercise($('#prac'), mod, last, pr, () => { P.practical[pr.id] = true; save(); renderSide(mod.id + '-cp'); });
    $('#tstart').addEventListener('click', () => {
      clearInterval(timerId); let s = pr.minutes * 60;
      timerId = setInterval(() => { s--; const el = $('#timer'); if (!el) return clearInterval(timerId); el.innerHTML = `${I.clock}${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s <= 0) { clearInterval(timerId); el.textContent = 'Time is up'; toast('Time is up. Finish your sentence, then check.', 'info'); } }, 1000);
    });
  }
  if (engineOk) buildState(mod, last).catch(() => setEngine('Database error', 'bad'));
}
const stripP = html => String(html).trim().replace(/^<p>([\s\S]*)<\/p>$/, '$1');
function wireMcQuiz(mod, qs) {
  const form = $('#quizform'), result = $('#quizresult');
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const answers = qs.map(q => { const x = form.querySelector(`input[name="${q.id}"]:checked`); return x ? Number(x.value) : -1; });
    if (answers.includes(-1)) { result.hidden = false; result.innerHTML = `<p style="margin:0">Answer all ${qs.length} questions first.</p>`; return; }
    let right = 0;
    answers.forEach((a, i) => {
      const q = qs[i], ok = !!q.options[a].correct, fb = form.querySelector(`[data-q="${q.id}"] .fb`);
      if (ok) right++;
      P.quiz[q.id] = { choice: a, correct: ok };
      const good = q.options.find(o => o.correct);
      setFb(fb, ok ? 'ok' : 'err', ok ? 'Correct' : 'Correct answer: ' + stripP(good.text).replace(/<[^>]+>/g, ''), q.explain ? stripP(q.explain) : '', true);
    });
    const pct = Math.round(right / qs.length * 100), ok = pct >= 70;
    if (!P.quizBest[mod.id] || pct > P.quizBest[mod.id].score) P.quizBest[mod.id] = { score: pct, passed: ok };
    save(); updateProgress();
    result.hidden = false;
    result.innerHTML = `<div class="score">${pct}% · ${ok ? 'passed' : 'not passed yet'}</div><p class="muted" style="margin:0">${right} of ${qs.length} correct. ${ok ? 'Well done.' : 'Read the feedback above, review the lessons behind the misses, and try again.'}</p>${ok ? '' : '<div class="btns"><button class="btn" type="button" id="qretry">Try again</button></div>'}`;
    if (ok && !RM.matches) { result.classList.remove('pop'); void result.offsetWidth; result.classList.add('pop'); }
    $('#qretry')?.addEventListener('click', () => { form.reset(); form.querySelectorAll('.fb').forEach(f => { f.className = 'fb'; f.innerHTML = ''; }); result.hidden = true; form.querySelector('input').focus(); });
    result.scrollIntoView({ block: 'nearest' });
  });
}
function nextModuleLink(mod) {
  const n = COURSE.modules[COURSE.modules.indexOf(mod) + 1];
  return n ? `<a class="btn primary" href="#${n.id}">Module ${esc(n.num)}: ${esc(n.title)}${I.right}</a>` : '';
}
function quizItem(q, i) {
  const st = P.quiz[q.id];
  const kind = { predict: 'Predict the output', write: 'Write the query' }[q.type] || '';
  let body = '';
  if (q.type === 'predict') body = `<textarea class="sql plain" placeholder="Write your prediction first" aria-label="Your prediction">${esc(P.drafts[q.id] || '')}</textarea><div class="btns"><button class="btn" type="button" data-act="reveal">Reveal the answer</button></div>`;
  else body = editor('q-' + q.id, P.drafts[q.id] || '') + `<div class="btns"><button class="btn primary" type="button" data-act="check">${I.check}Check answer</button><button class="btn" type="button" data-act="run">${I.play}Run query</button></div>`;
  const badge = st ? (st.correct ? '<span class="tag ok">Correct</span>' : '<span class="tag err">Not yet</span>') : '';
  return `<div class="card${st?.correct ? ' done' : ''}" data-q="${q.id}" data-reveal-target><div class="card-title"><span class="tag">${kind}</span><span class="grow"></span><span class="qbadge">${badge}</span></div><div class="prose">${q.text}</div>${body}<div class="res" aria-live="polite"></div><div class="exp"></div></div>`;
}
function wireQuiz(el, mod, q) {
  const out = $('.res', el), expEl = $('.exp', el);
  const showExp = () => { expEl.innerHTML = q.explain ? `<div class="fb info"><strong>Why</strong>${stripP(q.explain)}</div>` : ''; };
  const mark = ok => { el.classList.toggle('done', ok); $('.qbadge', el).innerHTML = ok ? '<span class="tag ok">Correct</span>' : '<span class="tag err">Not yet</span>'; };
  if (q.type === 'predict') {
    const ta = $('textarea', el); ta.addEventListener('input', () => { P.drafts[q.id] = ta.value; save(); });
    $('[data-act=reveal]', el).addEventListener('click', () => {
      if (!ta.value.trim()) { out.innerHTML = msgHtml('info', 'Write your prediction first. Guessing before you look is the point.'); return; }
      P.quiz[q.id] = { correct: true, revealed: true }; save(); mark(true);
      out.innerHTML = msgHtml('info', q.answer.replace(/`/g, ''), 'Answer') + (q.predictOutput ? label('What the database returns') + tableHtml(q.predictOutput, 10) : q.predictError ? errHtml(q.predictError) : ''); showExp();
    });
  }
  if (q.type === 'write') {
    const ta = $('textarea', el); ta.addEventListener('input', () => { P.drafts[q.id] = ta.value; save(); });
    const last = mod.lessons.length - 1;
    $('[data-act=run]', el).addEventListener('click', async () => { try { await buildState(mod, last); await applyExamples(mod.lessons[last]); out.innerHTML = label('Your output') + tableHtml((await run(ta.value)).t); } catch (e) { out.innerHTML = errHtml(e.message); } });
    $('[data-act=check]', el).addEventListener('click', async () => {
      try {
        await buildState(mod, last); await applyExamples(mod.lessons[last]);
        const mine = (await run(ta.value)).t, ref = (await run(q.solution)).t, p = compare(mine, ref, q.check);
        P.quiz[q.id] = { correct: !p }; save(); mark(!p);
        out.innerHTML = p ? msgHtml('err', p, 'Not yet') : msgHtml('ok', 'Your result matches the model answer.', 'Correct'); popRes(out);
        expEl.innerHTML = `<div class="res">${label('Model answer')}<pre><code>${esc(q.solution)}</code></pre></div>`; addCopyButtons(expEl);
      } catch (e) { out.innerHTML = errHtml(e.message); }
    });
  }
}

$('#menuBtn').addEventListener('click', () => { side.classList.add('open'); $('#scrim').classList.add('open'); $('#menuBtn').setAttribute('aria-expanded', 'true'); side.querySelector('a,button')?.focus(); });
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && side.classList.contains('open')) { closeDrawer(); $('#menuBtn').focus(); } });
$('#resetBtn').addEventListener('click', async () => {
  const hh = location.hash.slice(1); const m = hh.match(/^(m\w+?)-(l(\d+)|cp)$/);
  if (!m) { toast('Open a lesson first: the database is rebuilt for the lesson you are in.', 'info'); return; }
  if (!(await confirmModal('Reset the database?', 'This rebuilds the practice database for this lesson. Your saved answers stay; changes you made with SQL are undone.', 'Reset database'))) return;
  stateKey = ''; const mod = modById(m[1]); const idx = m[2] === 'cp' ? mod.lessons.length - 1 : mod.lessons.findIndex(l => l.id === hh);
  try { await buildState(mod, idx); toast('Database reset for this lesson.', 'ok'); } catch (e) { setEngine('Database error', 'bad'); toast(e.message, 'err'); }
});
$('#copyDataset').addEventListener('click', async () => { try { await navigator.clipboard.writeText(DATASET); toast('Dataset script copied. Paste it in the SQL editor of sql-course and run it.', 'ok'); } catch (e) { toast('Your browser blocked copying.', 'err'); } });
window.addEventListener('hashchange', route);
(async () => {
  try {
    const [c, d] = await Promise.all([fetch('data/course.json').then(r => r.json()), fetch('data/dataset.json').then(r => r.json())]);
    COURSE = c; DATASET = d.sql;
  } catch (e) { page.innerHTML = `<div class="banner">The course content could not load: ${esc(e.message)}</div>`; return; }
  route();
  try { await newDb(); await db.exec('SELECT 1'); engineOk = true; setEngine('PostgreSQL 18.7 ready', 'ok'); }
  catch (e) { engineFailed = true; setEngine('Database unavailable', 'bad'); console.error(e); }
  if (engineFailed) route();
})();
}
</script>
